<!doctype html>
<!-- generated by create-report: rebuilt on every publish, edits here are overwritten -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Reports</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f9f9f7; --card: #ffffff; --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
      --line: rgba(11, 11, 11, 0.1); --accent: #2a78d6;
      --t-longread: #c2410c; --t-paper: #44403c; --t-notebook: #f57c00; --t-cockpit: #1f4fd1;
      --t-roadmap: #0f766e; --t-blueprint: #1c5cab; --t-atlas: #8c5a2b;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0d0d0d; --card: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #898781; --line: rgba(255, 255, 255, 0.1); --accent: #5598e7; --t-longread: #f97316; --t-paper: #d6d3d1; --t-notebook: #fb923c; --t-cockpit: #6d8cf0; --t-roadmap: #2dd4bf; --t-blueprint: #5598e7; --t-atlas: #d4a373; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrap { max-width: 56rem; margin: 0 auto; padding: clamp(2rem, 6vw, 4rem) 1.25rem 4rem; }
    header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 1rem; margin-bottom: 1.8rem; }
    h1 { font-size: clamp(2rem, 1.5rem + 2vw, 2.8rem); letter-spacing: -0.02em; margin: 0; line-height: 1.1; }
    .count { color: var(--ink-3); font-size: 0.9rem; margin: 0.3rem 0 0; }
    input[type="search"] { font: inherit; width: min(100%, 18rem); padding: 0.55rem 0.8rem; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    .cards { display: grid; gap: 0.9rem; list-style: none; padding: 0; margin: 0; }
    .card { display: block; position: relative; padding: 1.1rem 1.2rem 1.1rem 1.5rem; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: inherit; text-decoration: none; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .card::before { content: ""; position: absolute; left: 0; top: 0.9rem; bottom: 0.9rem; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); }
    .card[data-template="longread"]::before, .card[data-template="editorial"]::before { background: var(--t-longread); }
    .card[data-template="paper"]::before { background: var(--t-paper); }
    .card[data-template="notebook"]::before { background: var(--t-notebook); }
    .card[data-template="cockpit"]::before, .card[data-template="dashboard"]::before { background: var(--t-cockpit); }
    .card[data-template="roadmap"]::before { background: var(--t-roadmap); }
    .card[data-template="blueprint"]::before { background: var(--t-blueprint); }
    .card[data-template="atlas"]::before, .card[data-template="explorer"]::before { background: var(--t-atlas); }
    .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem 1rem; }
    .formats { color: var(--accent); font-size: 0.9rem; text-decoration: none; }
    .formats:hover { text-decoration: underline; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px -15px rgba(0, 0, 0, 0.35); }
    .card time { font-size: 0.8rem; color: var(--ink-3); }
    .card h2 { font-size: 1.15rem; margin: 0.15rem 0 0.35rem; line-height: 1.3; }
    .card p { margin: 0; color: var(--ink-2); font-size: 0.95rem; }
    .tags { display: flex; flex-wrap: wrap; gap: 0.3rem; list-style: none; padding: 0; margin: 0.7rem 0 0; }
    .tags li { font-size: 0.72rem; padding: 0.05rem 0.5rem; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-2); }
    .empty { color: var(--ink-3); }
    .other { margin-top: 3rem; font-size: 0.9rem; color: var(--ink-2); }
    .other h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); }
    .other ul { padding-left: 1.1rem; }
    .other a { color: var(--accent); }
    @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Reports</h1>
        <p class="count">{{COUNT}}</p>
      </div>
      <div class="tools">
        <a class="formats" href="report-formats/">Report formats</a>
        <input type="search" placeholder="Filter…" aria-label="Filter reports">
      </div>
    </header>
    <ul class="cards">
{{CARDS}}
    </ul>
{{OTHER}}
  </div>
  <script>
    var input = document.querySelector('input[type="search"]');
    var cards = Array.prototype.slice.call(document.querySelectorAll(".cards > li"));
    input.addEventListener("input", function () {
      var q = input.value.trim().toLowerCase();
      cards.forEach(function (c) { c.hidden = q && c.textContent.toLowerCase().indexOf(q) < 0; });
    });
  </script>
</body>
</html>
